; PlatformIO Project Configuration File
; This project uses two uploadable entrypoints: controller.cpp and robot.cpp.
; Shared modules reside directly in the lib/ folder.

[env:controller]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
build_type = debug

build_flags =
    -O0
    -g
    -ggdb
    -Ilib
lib_deps =
    mikem/RadioHead@^1.120
    lowpowerlab/RFM69
    arriflex/Adafruit Feather OLED@^1
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.16
    adafruit/Adafruit SH110X@^2.1.14
    sensirion/Sensirion I2C SEN66@^1.3.1
build_src_filter = build_src_filter = +<controller.cpp> -<robot.cpp> +<handlers/>
monitor_speed = 115200
monitor_filters = time


; Direct PlatformIO to use a serial GDB stub
; debug_tool = custom
; debug_port = /dev/ttyACM1  ; <-- Change this to your exact Feather port
; debug_init_break = tbreak setup
; debug_server = 
; debug_load_cmd = preload
; debug_server_ready_pattern = 
; debug_extra_cmds =
;     target remote $DEBUG_PORT

[env:robot]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
build_type = debug
build_flags =
    -O0
    -g
    -ggdb
    -Ilib
lib_deps =
    mikem/RadioHead@^1.120
    lowpowerlab/RFM69
    arriflex/Adafruit Feather OLED@^1
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.16
    adafruit/Adafruit SH110X@^2.1.14
    sensirion/Sensirion I2C SEN66@^1.3.1
    
build_src_filter = build_src_filter = -<controller.cpp> +<robot.cpp> +<handlers/>
monitor_speed = 115200
monitor_filters = time, colorize

# --- TESTING CONFIGURATION FOR THE ROBOT HARDWARE ---
# Tell the test engine to use Unity
test_framework = unity
# When executing a test, tell it to completely ignore your robot production app entry point
test_build_src = no
