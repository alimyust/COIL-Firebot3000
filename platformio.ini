; PlatformIO Project Configuration File
; This project now uses two uploadable entrypoints: controller.cpp and robot.cpp.
; Support modules are moved into lib/project and headers remain in include/.

[env:controller]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino

lib_deps =
    mikem/RadioHead@^1.120
    lib/tagtronics
    lowpowerlab/RFM69

build_src_filter =
    +<controller.cpp>

[env:robot]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino

lib_deps =
    mikem/RadioHead@^1.120
    lib/tagtronics
    lowpowerlab/RFM69
    arriflex/Adafruit Feather OLED@^1
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.16
    adafruit/Adafruit SH110X@^2.1.14

build_src_filter =
    +<robot.cpp>
